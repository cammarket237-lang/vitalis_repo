server {
    
    server_name cammarket237.com www.cammarket237.com;

    root /var/www/cammarket237;
    index index.html;

    location /.well-known/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }

    location /uploads/ {
        alias /var/www/cammarket237/uploads/;
    }

    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cammarket237.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cammarket237.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.cammarket237.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = cammarket237.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    
    server_name cammarket237.com www.cammarket237.com;
    return 404; # managed by Certbot




}